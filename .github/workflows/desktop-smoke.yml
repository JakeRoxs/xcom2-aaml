name: AAML Desktop Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64]
    environment: desktop-smoke
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore src/AAML.Avalonia/AAML.Avalonia.csproj --locked-mode
      - shell: pwsh
        run: ./eng/stage-aaml-package.ps1 -Rid 'win-x64' -OutputDirectory '${{ runner.temp }}/AAML Desktop Smoke/win-x64' -Version '0.0.0-smoke.${{ github.run_number }}' -Repository '${{ github.repository }}' -Commit '${{ github.sha }}'
      - shell: pwsh
        run: ./eng/validate-aaml-artifact.ps1 -ArtifactDirectory '${{ runner.temp }}/AAML Desktop Smoke/win-x64' -ManifestPath '${{ github.workspace }}/eng/package-manifests/aaml-win-x64.json' -GenerateChecksums
      - shell: pwsh
        run: ./eng/run-windows-desktop-smoke.ps1 -ArtifactDirectory '${{ runner.temp }}/AAML Desktop Smoke/win-x64' -EvidenceDirectory '${{ runner.temp }}/AAML Desktop Smoke/evidence'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/AAML Desktop Smoke/evidence
          if-no-files-found: warn
          retention-days: 14
