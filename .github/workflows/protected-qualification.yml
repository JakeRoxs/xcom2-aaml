name: AAML Protected Qualification

run-name: Qualify ${{ inputs.scenario }} artifact ${{ inputs.artifact_name }} from run ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Protected qualification scenario
        required: true
        type: choice
        options:
          - windows-game
          - linux-proton
          - steam-mutation
      source_run_id:
        description: Workflow run containing the exact archive artifact
        required: true
        type: string
      artifact_name:
        description: Exact Actions artifact name
        required: true
        type: string
      archive_file:
        description: Archive filename inside the Actions artifact
        required: true
        type: string
      archive_sha256:
        description: Expected lowercase SHA-256 of the archive
        required: true
        type: string
      expected_commit:
        description: Commit embedded in release-metadata.json
        required: true
        type: string
      expected_version:
        description: Version embedded in release-metadata.json
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: aaml-protected-qualification
  cancel-in-progress: false

jobs:
  windows-game:
    if: inputs.scenario == 'windows-game'
    runs-on: [self-hosted, Windows, X64, aaml-protected, aaml-windows-game]
    environment: qualification-windows-game
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/AAML Qualification/input
      - name: Qualify exact archive
        shell: pwsh
        run: >-
          ./eng/qualification/invoke-protected-qualification.ps1
          -Scenario windows-game
          -ArchivePath '${{ runner.temp }}/AAML Qualification/input/${{ inputs.archive_file }}'
          -ExpectedArchiveSha256 '${{ inputs.archive_sha256 }}'
          -ExpectedRepository '${{ github.server_url }}/${{ github.repository }}'
          -ExpectedCommit '${{ inputs.expected_commit }}'
          -ExpectedVersion '${{ inputs.expected_version }}'
          -RunnerConfigPath "$env:AAML_QUALIFICATION_CONFIG"
          -WorkDirectory '${{ runner.temp }}/AAML Qualification/work'
          -EvidenceDirectory '${{ runner.temp }}/AAML Qualification/evidence'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-windows-game-${{ github.run_id }}
          path: ${{ runner.temp }}/AAML Qualification/evidence
          if-no-files-found: error
          retention-days: 30

  linux-proton:
    if: inputs.scenario == 'linux-proton'
    runs-on: [self-hosted, Linux, X64, aaml-protected, aaml-linux-proton]
    environment: qualification-linux-proton
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/AAML Qualification/input
      - name: Qualify exact archive
        shell: pwsh
        run: >-
          ./eng/qualification/invoke-protected-qualification.ps1
          -Scenario linux-proton
          -ArchivePath '${{ runner.temp }}/AAML Qualification/input/${{ inputs.archive_file }}'
          -ExpectedArchiveSha256 '${{ inputs.archive_sha256 }}'
          -ExpectedRepository '${{ github.server_url }}/${{ github.repository }}'
          -ExpectedCommit '${{ inputs.expected_commit }}'
          -ExpectedVersion '${{ inputs.expected_version }}'
          -RunnerConfigPath "$env:AAML_QUALIFICATION_CONFIG"
          -WorkDirectory '${{ runner.temp }}/AAML Qualification/work'
          -EvidenceDirectory '${{ runner.temp }}/AAML Qualification/evidence'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-linux-proton-${{ github.run_id }}
          path: ${{ runner.temp }}/AAML Qualification/evidence
          if-no-files-found: error
          retention-days: 30

  steam-mutation:
    if: inputs.scenario == 'steam-mutation'
    runs-on: [self-hosted, Windows, X64, aaml-protected, aaml-steam-mutation]
    environment: qualification-steam-mutation
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/AAML Qualification/input
      - name: Qualify exact archive and restore mutation state
        shell: pwsh
        run: >-
          ./eng/qualification/invoke-protected-qualification.ps1
          -Scenario steam-mutation
          -ArchivePath '${{ runner.temp }}/AAML Qualification/input/${{ inputs.archive_file }}'
          -ExpectedArchiveSha256 '${{ inputs.archive_sha256 }}'
          -ExpectedRepository '${{ github.server_url }}/${{ github.repository }}'
          -ExpectedCommit '${{ inputs.expected_commit }}'
          -ExpectedVersion '${{ inputs.expected_version }}'
          -RunnerConfigPath "$env:AAML_QUALIFICATION_CONFIG"
          -WorkDirectory '${{ runner.temp }}/AAML Qualification/work'
          -EvidenceDirectory '${{ runner.temp }}/AAML Qualification/evidence'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-steam-mutation-${{ github.run_id }}
          path: ${{ runner.temp }}/AAML Qualification/evidence
          if-no-files-found: error
          retention-days: 30
