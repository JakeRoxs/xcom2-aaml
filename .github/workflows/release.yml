name: AAML Official Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without the v prefix
        required: true
        type: string
      create_release:
        description: Create the GitHub release after archives build
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aaml-official-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  win:
    name: Build win-x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.Substring(1) } else { '${{ inputs.version }}' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Publish single-file
        shell: pwsh
        run: >-
          dotnet publish src/AAML.Avalonia/AAML.Avalonia.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:PublishAot=false
          -p:Version='${{ steps.version.outputs.value }}' -p:DebugType=None -p:DebugSymbols=false
          -o "AAML win-x64"
      - name: Add licenses
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'AAML win-x64/licenses' -Force | Out-Null
          Copy-Item 'src/ThirdParty/Steamworks.NET/LICENSE.txt' 'AAML win-x64/licenses/Steamworks.NET-LICENSE.txt'
          Copy-Item 'LICENSE' 'AAML win-x64/licenses/AAML-GPL-3.0.txt'
      - name: Zip
        shell: pwsh
        run: Compress-Archive -LiteralPath 'AAML win-x64' -DestinationPath "AAML-${{ steps.version.outputs.value }}-win-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: AAML-${{ steps.version.outputs.value }}-win-x64
          path: AAML-*-win-x64.zip
          if-no-files-found: error

  linux:
    name: Build linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${{ inputs.version }}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish
        run: |
          dotnet publish src/AAML.Avalonia/AAML.Avalonia.csproj -c Release -r linux-x64 --self-contained true -o "AAML linux-x64"
          dotnet publish tools/AAML.ProtonWrapper/AAML.ProtonWrapper.csproj -c Release -r linux-x64 --self-contained true -o "AAML linux-x64/tools/proton-wrapper"
      - name: Add licenses
        run: |
          mkdir -p "AAML linux-x64/licenses"
          cp src/ThirdParty/Steamworks.NET/LICENSE.txt "AAML linux-x64/licenses/Steamworks.NET-LICENSE.txt"
          cp LICENSE "AAML linux-x64/licenses/AAML-GPL-3.0.txt"
      - name: Tar
        run: tar -czf "AAML-${{ steps.version.outputs.value }}-linux-x64.tar.gz" "AAML linux-x64"
      - uses: actions/upload-artifact@v7
        with:
          name: AAML-${{ steps.version.outputs.value }}-linux-x64
          path: AAML-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
    needs: [win, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: AAML-*
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.win.outputs.version }}"
          gh release create "v${version}" release-assets/* --verify-tag --generate-notes
