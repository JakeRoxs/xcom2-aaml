name: AAML CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aaml-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore AAML.slnx -p:Platform="Any CPU" --locked-mode
      - run: dotnet build AAML.slnx -p:Configuration=Release -p:Platform="Any CPU" --no-restore
      - run: dotnet test AAML.slnx -p:Configuration=Release -p:Platform="Any CPU" --no-build --filter TestCategory!=SteamLive
      - shell: pwsh
        run: ./eng/test-brand-assets.ps1
      - if: runner.os == 'Linux'
        name: Validate Linux desktop metadata
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils
          desktop-file-validate eng/linux/io.github.jakeroxs.xcom2_aaml.desktop
          appstreamcli validate --pedantic eng/linux/io.github.jakeroxs.xcom2_aaml.metainfo.xml
