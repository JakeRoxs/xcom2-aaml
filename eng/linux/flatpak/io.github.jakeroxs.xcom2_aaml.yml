app-id: io.github.jakeroxs.xcom2_aaml
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: AAML

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=~/.steam
  - --filesystem=xdg-data/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/run/media
  - --filesystem=host-os

modules:
  - name: aaml
    buildsystem: simple
    build-commands:
      - install -d /app/lib/aaml /app/bin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/256x256/apps
      - cp -a . /app/lib/aaml/
      - ln -s ../lib/aaml/AAML /app/bin/AAML
      - ln -s ../lib/aaml/tools/proton-wrapper/AAML.ProtonWrapper /app/bin/AAML.ProtonWrapper
      - install -m 0755 aaml-proton-launch-option.sh /app/bin/aaml-proton-launch-option
      - install -m 0644 share/applications/io.github.jakeroxs.xcom2_aaml.desktop /app/share/applications/io.github.jakeroxs.xcom2_aaml.desktop
      - install -m 0644 share/metainfo/io.github.jakeroxs.xcom2_aaml.metainfo.xml /app/share/metainfo/io.github.jakeroxs.xcom2_aaml.metainfo.xml
      - install -m 0644 share/icons/hicolor/256x256/apps/io.github.jakeroxs.xcom2_aaml.png /app/share/icons/hicolor/256x256/apps/io.github.jakeroxs.xcom2_aaml.png
    sources:
      - type: dir
        path: payload
      - type: file
        path: aaml-proton-launch-option.sh
